apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestration-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-orchestration

  template:
    metadata:
      labels:
        app: ai-orchestration

    spec:
      containers:
        - name: ai-orchestration
          image: ai-orchestration:v6
          imagePullPolicy: IfNotPresent

          env:
            - name: SANDBOX_SERVER_URL
              value: "http://sandbox-server:3000"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ai-orchestration-secret
                  key: MONGO_URI

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-orchestration-secret
                  key: GEMINI_API_KEY

            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-orchestration-secret
                  key: GOOGLE_CLIENT_ID

          ports:
            - containerPort: 4000

          livenessProbe:
            httpGet:
              path: /api/ai/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/ai/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

            