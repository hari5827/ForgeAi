apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-server-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: sandbox-server

  template:
    metadata:
      labels:
        app: sandbox-server

    spec:
      serviceAccountName: resource-manager

      containers:
        - name: sandbox-server
          image: sandbox-server:v22
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          livenessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
