<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14121C"/>
      <stop offset="55%" stop-color="#1D1A29"/>
      <stop offset="100%" stop-color="#241E33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B5CFA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B5CFA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#7B5CFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7B5CFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#spot)"/>

  <!-- circuit-ish grid lines -->
  <g stroke="#3A3450" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="860" y1="0" x2="860" y2="360"/>
    <path d="M860 60 L920 60 L920 120" fill="none"/>
    <path d="M860 300 L980 300 L980 240" fill="none"/>
    <circle cx="920" cy="120" r="4" fill="#7B5CFA"/>
    <circle cx="980" cy="240" r="4" fill="#7B5CFA"/>
  </g>

  <!-- Mark: forge / anvil, echoing repo logo -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="180" height="180" rx="34" fill="#0F0D15"/>
    <rect x="0" y="0" width="180" height="180" rx="34" fill="none" stroke="#7B5CFA" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M28 118 L52 102 L52 97 L128 97 L128 102 L152 118 L152 132 L28 132 Z" fill="#B7B0C9"/>
    <rect x="80" y="132" width="18" height="14" fill="#8B84A0"/>
    <rect x="64" y="146" width="50" height="12" rx="3" fill="#B7B0C9"/>
    <circle cx="134" cy="78" r="4.5" fill="#7B5CFA"/>
    <circle cx="148" cy="63" r="3.4" fill="#A78BFA"/>
    <circle cx="120" cy="64" r="2.8" fill="#A78BFA"/>
    <path d="M160 42 L146 56 L160 70" stroke="#7B5CFA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="310" y="175" font-size="86" font-weight="800" letter-spacing="-1">
    <tspan fill="#F3F1F8">Forge</tspan><tspan fill="#7B5CFA">AI</tspan>
  </text>
  <text x="313" y="212" font-size="24" font-weight="500" fill="#9C96AF">
    Prompt-to-app builder — AI planning, isolated sandboxes, live preview
  </text>

  <!-- tech chips -->
  <g font-size="15" font-weight="600" fill="#C9C4D8">
    <g transform="translate(313,250)">
      <rect width="118" height="34" rx="17" fill="#26212F" stroke="#3A3450"/>
      <text x="59" y="22" text-anchor="middle">React + Vite</text>
    </g>
    <g transform="translate(443,250)">
      <rect width="122" height="34" rx="17" fill="#26212F" stroke="#3A3450"/>
      <text x="61" y="22" text-anchor="middle">Node / Express</text>
    </g>
    <g transform="translate(577,250)">
      <rect width="108" height="34" rx="17" fill="#26212F" stroke="#3A3450"/>
      <text x="54" y="22" text-anchor="middle">Kubernetes</text>
    </g>
    <g transform="translate(697,250)">
      <rect width="120" height="34" rx="17" fill="#26212F" stroke="#3A3450"/>
      <text x="60" y="22" text-anchor="middle">Gemini API</text>
    </g>
    <g transform="translate(313,296)">
      <rect width="120" height="34" rx="17" fill="#26212F" stroke="#3A3450"/>
      <text x="60" y="22" text-anchor="middle">MongoDB</text>
    </g>
    <g transform="translate(445,296)">
      <rect width="100" height="34" rx="17" fill="#26212F" stroke="#3A3450"/>
      <text x="50" y="22" text-anchor="middle">Docker</text>
    </g>
    <g transform="translate(557,296)">
      <rect width="130" height="34" rx="17" fill="#26212F" stroke="#3A3450"/>
